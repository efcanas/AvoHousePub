<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AvoHouse Pub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Helvetica Neue', Arial, sans-serif;
color:white;
background:url('Fondo.png') center/cover fixed no-repeat;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
z-index:-1;
}

/* ===== PORTADA ===== */

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero img{
width:320px;
max-width:90%;
margin-bottom:20px;
}

.hero h1{
font-size:2em;
letter-spacing:4px;
margin-bottom:15px;
}

.hero p{
font-size:1.1em;
letter-spacing:2px;
color:#ccc;
margin-bottom:30px;
}

.hero button{
padding:14px 30px;
border:1px solid white;
background:transparent;
color:white;
font-size:0.9em;
letter-spacing:2px;
cursor:pointer;
transition:0.3s;
border-radius:30px;
margin-bottom:30px;
}

.hero button:hover{
background:white;
color:black;
}

/* ===== REDES ===== */

.social-icons{
display:flex;
gap:25px;
justify-content:center;
}

.social-icons a img{
width:32px;
transition:0.3s;
}

.social-icons a img:hover{
transform:scale(1.2);
}

/* ===== MENÚ ===== */

.menu-section{
padding:100px 20px 80px 20px;
text-align:center;
}

.menu-title{
font-size:1.6em;
letter-spacing:4px;
margin-bottom:40px;
}

.menu-buttons{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.menu-buttons a{
text-decoration:none;
color:white;
border:1px solid rgba(255,255,255,0.3);
padding:15px 25px;
border-radius:30px;
font-size:0.9em;
letter-spacing:2px;
transition:0.3s;
}

.menu-buttons a:hover{
background:white;
color:black;
}

/* RESPONSIVE */

@media(max-width:480px){

.hero img{
width:260px;
}

.hero h1{
font-size:1.6em;
}

.hero p{
font-size:1em;
}

}

</style>
</head>

<body>

<!-- PORTADA -->

<section class="hero">
<img src="LogoPrincipal.png">
<h1>AvoHouse Pub</h1>
<p>Donde la música acompaña, no interrumpe.</p>

<button onclick="document.getElementById('menu').scrollIntoView()">Ver Menú ↓</button>

<div class="social-icons">
<a href="https://wa.me/573026475174" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
</a>

<a href="https://www.instagram.com/avohouseguaviare" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
</a>

<a href="https://www.facebook.com/people/Avohouse-Guaviare/" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/733/733547.png">
</a>

<a href="https://www.google.com/maps/place/AvoHouse/@2.5596824,-72.6297883" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
</a>
</div>

</section>

<!-- MENÚ -->

<section id="menu" class="menu-section">

<div class="menu-title">MENÚ</div>

<div class="menu-buttons">
<a href="ahtv/index.html">Solicitar música</a>
<a href="mezcladitas.html">Mezcladitas</a>
<a href="cervezas.html">Cervezas</a>
<a href="sinalcohol.html">Sin Alcohol</a>
</div>

</section>

</body>
</html>
