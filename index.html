<!DOCTYPE html>
<html lang="es">
<head>
<link rel="preload" as="image" href="Fondo.png" fetchpriority="high">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AvoHouse Pub</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth}html,body{background-color:#0b0b0b}
body{font-family:'Helvetica Neue',Arial,sans-serif;color:white;background:url('Fondo.png') center/cover fixed no-repeat}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:-1}

/* ===== PORTADA ===== */
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;position:relative}
.hero img{width:320px;max-width:90%;margin-bottom:20px}
.hero h1{font-size:2em;letter-spacing:4px;margin-bottom:15px}
.hero p{font-size:1.1em;letter-spacing:2px;color:#ccc;margin-bottom:30px}

/* ===== BOTÓN REGISTRO SUPERIOR ===== */
.top-register{position:absolute;top:24px;right:24px}
.top-register a{display:inline-block;text-decoration:none;color:white;border:1px solid rgba(255,255,255,.6);padding:10px 18px;border-radius:24px;font-size:.78em;letter-spacing:1.5px;transition:.3s;background:rgba(0,0,0,.22)}
.top-register a:hover{background:white;color:black;border-color:white}

.hero button{padding:14px 30px;border:1px solid white;background:transparent;color:white;font-size:.9em;letter-spacing:2px;cursor:pointer;transition:.3s;border-radius:30px;margin-bottom:30px}
.hero button:hover{background:white;color:black}
.social-icons{display:flex;gap:25px;justify-content:center}
.social-icons a img{width:32px;transition:.3s}
.social-icons a img:hover{transform:scale(1.2)}

/* ===== MENÚ ===== */
.menu-section{padding:100px 20px 80px;text-align:center}
.menu-title{font-size:1.6em;letter-spacing:4px;margin-bottom:40px}
.menu-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.menu-buttons a{display:inline-block;text-decoration:none;color:white;border:1px solid rgba(255,255,255,.3);padding:15px 25px;border-radius:30px;font-size:.9em;letter-spacing:2px;transition:.3s}
.menu-buttons a:hover{background:white;color:black}

/* ===== REGISTRO ===== */
.register-section{padding:40px 20px 110px;max-width:720px;margin:0 auto}
.register-title{text-align:center;font-size:1.6em;letter-spacing:4px;margin-bottom:12px}
.register-intro{text-align:center;color:#ccc;line-height:1.55;margin-bottom:35px}
.register-card{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:28px;backdrop-filter:blur(5px)}
.register-card h2{font-size:18px;margin:22px 0 14px;letter-spacing:1px}
.field{display:block;font-weight:600;margin-bottom:16px}
.field input,.field select{width:100%;margin-top:7px;padding:12px 13px;border:1px solid rgba(255,255,255,.25);border-radius:10px;background:rgba(255,255,255,.08);color:white;font:inherit}
.field select option{color:#111}
.field input:focus,.field select:focus{outline:2px solid rgba(255,255,255,.25)}
.radios{display:flex;gap:22px;margin-top:10px;font-weight:400}
.radios label,.check{display:flex;gap:9px;align-items:flex-start;font-weight:400;line-height:1.45}
.radios input,.check input{width:auto;margin-top:4px}
.hidden{display:none}
.consent{border-top:1px solid rgba(255,255,255,.15);padding-top:16px;margin-top:16px}
.consent a{color:white;text-decoration:underline;font-size:14px}
.optional{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px}
.register-submit{width:100%;border:1px solid white;border-radius:12px;padding:14px;background:transparent;color:white;font-size:16px;font-weight:700;cursor:pointer;margin-top:24px;transition:.3s}
.register-submit:hover:not(:disabled){background:white;color:black}
.register-submit:disabled{opacity:.35;cursor:not-allowed}
.form-note{font-size:12px;color:#aaa;line-height:1.5;margin-top:14px}
.form-error{display:none;color:#ffb4b4;font-size:13px;margin-top:6px}

@media(max-width:480px){
.hero img{width:260px}.hero h1{font-size:1.6em}.hero p{font-size:1em}
.top-register{top:16px;right:16px}
.top-register a{padding:9px 14px;font-size:.72em}
.register-card{padding:22px}
}
</style>
</head>

</div>

</html>
