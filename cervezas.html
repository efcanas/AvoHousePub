<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cervezas | AvoHouse Pub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Helvetica Neue', Arial, sans-serif;
color:white;
background:url('Fondo.webp') center/cover fixed no-repeat;
padding-top:300px;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
z-index:-1;
}

/* Encabezado compartido con Administración */

/* CONTENIDO */

.container{
max-width:1100px;
margin:18px auto 80px auto;
padding:0 20px;
}

/* SECCIÓN */

.section-title{
font-size:1.4em;
letter-spacing:3px;
margin:60px 0 30px 0;
text-align:center;
}

.nacionales{
color:#d4af37;
}

.extranjeras{
color:#4da6ff;
}

.product-grid{
display:grid;
grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
gap:35px;
}

.product-card{
text-align:center;
}

.product-card img{
width:100%;
border-radius:12px;
margin-bottom:15px;
transition:transform 0.3s ease, box-shadow 0.3s ease;
}

.product-card img:hover{
transform:scale(1.12);
}

/* Neon */

.neon-nacional{
box-shadow:0 0 10px #d4af37, 0 0 22px #d4af37;
}

.neon-extranjera{
box-shadow:0 0 10px #4da6ff, 0 0 22px #4da6ff;
}

.product-name{
font-size:1em;
margin-bottom:6px;
}

.price{
font-size:0.95em;
color:#e0e0e0;
}

.back{
display:block;
text-align:center;
margin-top:60px;
color:#ccc;
text-decoration:none;
font-size:0.9em;
}

.back:hover{
color:white;
}



</style>
<link rel="stylesheet" href="cuenta/admin/header.css?v=20261004-2">

</head>
