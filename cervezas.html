<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cervezas | AvoHouse Pub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Helvetica Neue', Arial, sans-serif;
color:white;
background:url('Fondo.png') center/cover fixed no-repeat;
padding-top:240px;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
z-index:-1;
}

/* HEADER */

.header{
position:fixed;
top:0;
left:0;
width:100%;
z-index:1000;
text-align:center;
padding:25px 20px 15px 20px;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(8px);
border-bottom:1px solid rgba(255,255,255,0.08);
transition:all 0.3s ease;
}

.header.shrink{
padding:10px 20px 5px 20px;
}

.logo{
width:270px;
max-width:90%;
margin-bottom:8px;
transition:all 0.3s ease;
}

.header.shrink .logo{
width:170px;
}

.title{
font-size:1.5em;
letter-spacing:3px;
margin-bottom:15px;
transition:all 0.3s ease;
color:#4da6ff; /* Color distintivo Cervezas */
}

.header.shrink .title{
font-size:1.1em;
margin-bottom:8px;
}

/* NAV */

.menu-nav{
display:flex;
overflow-x:auto;
gap:12px;
padding:10px 20px 20px 20px;
justify-content:center;
}

.menu-nav::-webkit-scrollbar{
display:none;
}

.menu-nav a{
flex:0 0 auto;
text-decoration:none;
color:white;
padding:10px 18px;
border:1px solid rgba(255,255,255,0.25);
border-radius:30px;
font-size:0.85em;
white-space:nowrap;
transition:0.3s;
}

.menu-nav a:hover{
background:white;
color:#111;
}

/* BOTÓN ACTIVO */

.menu-nav a.active{
background:rgba(77,166,255,0.15);
color:#4da6ff;
font-weight:600;
border-color:#4da6ff;
}

/* CONTENIDO */

.container{
max-width:1100px;
margin:80px auto 80px auto;
padding:0 20px;
}

/* SECCIÓN */

.section-title{
font-size:1.4em;
letter-spacing:3px;
margin:60px 0 30px 0;
text-align:center;
}

.nacionales{
color:#d4af37;
}

.extranjeras{
color:#4da6ff;
}

.product-grid{
display:grid;
grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
gap:35px;
}

.product-card{
text-align:center;
}

.product-card img{
width:100%;
border-radius:12px;
margin-bottom:15px;
transition:transform 0.3s ease, box-shadow 0.3s ease;
}

.product-card img:hover{
transform:scale(1.12);
}

/* Neon */

.neon-nacional{
box-shadow:0 0 10px #d4af37, 0 0 22px #d4af37;
}

.neon-extranjera{
box-shadow:0 0 10px #4da6ff, 0 0 22px #4da6ff;
}

.product-name{
font-size:1em;
margin-bottom:6px;
}

.price{
font-size:0.95em;
color:#e0e0e0;
}

.back{
display:block;
text-align:center;
margin-top:60px;
color:#ccc;
text-decoration:none;
font-size:0.9em;
}

.back:hover{
color:white;
}

</style>
</head>

<body>

<div class="header">
<img src="LogoPrincipal.png" class="logo">
<div class="title">Cervezas</div>

<div class="menu-nav">
<a href="index.html">Inicio</a>
<a href="mezcladitas.html">Mezcladitas</a>
<a href="firma.html">Firma de la Casa</a>
<a href="cervezas.html" class="active">Cervezas</a>
<a href="sinalcohol.html">Sin Alcohol</a>
</div>
</div>

<div class="container">

<!-- NACIONALES -->
<div class="section-title nacionales">NACIONALES</div>

<div class="product-grid">

<div class="product-card">
<img src="productos/Rosada.png" class="neon-nacional" loading="lazy" decoding="async">
</div>

<div class="product-card">
<img src="productos/A%CC%81guila.png" class="neon-nacional" loading="lazy" decoding="async">
</div>

<div class="product-card">
<img src="productos/A%CC%81guila%20Light.png" class="neon-nacional" loading="lazy" decoding="async">
</div>

<div class="product-card">
<img src="productos/CCDorada.png" class="neon-nacional" loading="lazy" decoding="async">
</div>

<div class="product-card">
<img src="productos/CCRoja.png" class="neon-nacional" loading="lazy" decoding="async">
</div>

<div class="product-card">
<img src="productos/CCTrigo.png" class="neon-nacional" loading="lazy" decoding="async">
</div>

<div class="product-card">
<img src="productos/Costen%CC%83a.png" class="neon-nacional" loading="lazy" decoding="async">
</div>

<div class="product-card">
<img src="productos/Poker.png" class="neon-nacional" loading="lazy" decoding="async">
</div>

</div>

<!-- EXTRANJERAS -->
<div class="section-title extranjeras">EXTRANJERAS</div>

<div class="product-grid">

<div class="product-card">
<img src="productos/Budweiser.png" class="neon-extranjera" loading="lazy" decoding="async">
</div>

<div class="product-card">
<img src="productos/Corona.png" class="neon-extranjera" loading="lazy" decoding="async">
</div>

<div class="product-card">
<img src="productos/Coronita.png" class="neon-extranjera" loading="lazy" decoding="async">
</div>

<div class="product-card">
<img src="productos/Stella.png" class="neon-extranjera" loading="lazy" decoding="async">
</div>

</div>

<a href="index.html" class="back">← Volver al inicio</a>

</div>

<script>
window.addEventListener("scroll", function(){
const header = document.querySelector(".header");
if(window.scrollY > 80){
header.classList.add("shrink");
} else {
header.classList.remove("shrink");
}
});
</script>

</body>
</html>
