<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AHtv · Acceso a música</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 600px;
      height: 178px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .panel {
      width: 600px;
      height: 178px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 8px 12px;
      overflow: hidden;
      border: 1px solid rgba(184,255,57,.55);
      border-radius: 13px;
      background: rgba(8,10,13,.94);
      box-shadow: 0 5px 18px rgba(0,0,0,.24);
    }
    #qr {
      flex: 0 0 158px;
      width: 158px;
      height: 158px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      border-radius: 7px;
      background: #fff;
    }
    #qr canvas, #qr img {
      display: block;
      width: 148px !important;
      height: 148px !important;
      image-rendering: pixelated;
    }
    .details { min-width: 0; flex: 1 1 auto; }
    .brand {
      color: #b8ff39;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .title {
      font-size: 19px;
      line-height: 1.15;
      font-weight: 800;
      margin-bottom: 5px;
    }
    .hint {
      color: #d0d4da;
      font-size: 11px;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .code {
      color: #fff;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: .15px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .foot {
      color: #a0a6af;
      font-size: 9px;
      margin-top: 5px;
    }
    .error { color: #ffb8b8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="panel">
    <div id="qr" aria-label="Código QR para solicitar música"></div>
    <div class="details">
      <div class="brand">AvoHouse · AHtv</div>
      <div class="title">¿Quieres pedir una canción?</div>
      <div class="hint">Escanea el QR o escribe esta clave en AHtv.</div>
      <div id="accessCode" class="code">Cargando clave…</div>
      <div class="foot">El acceso se renueva automáticamente cada dos horas.</div>
    </div>
  </div>
  <script src="vendor/qrcode.min.js"></script>
  <script>
    (function () {
      const code = String(new URLSearchParams(window.location.search).get('code') || '').trim().toLowerCase();
      const codeEl = document.getElementById('accessCode');
      const qrEl = document.getElementById('qr');
      const valid = /^[a-z]+(?:-[a-z]+){2}$/.test(code);

      if (!valid || typeof QRCode === 'undefined') {
        codeEl.textContent = 'Clave no disponible';
        codeEl.classList.add('error');
        qrEl.textContent = 'QR no disponible';
        qrEl.style.color = '#111';
        qrEl.style.fontSize = '11px';
        qrEl.style.textAlign = 'center';
        return;
      }

      codeEl.textContent = code;
      const target = new URL('/ahtv/index.html', window.location.origin);
      target.searchParams.set('access', code);
      new QRCode(qrEl, {
        text: target.toString(),
        width: 148,
        height: 148,
        colorDark: '#0c0d10',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    })();
  </script>
</body>
</html>
