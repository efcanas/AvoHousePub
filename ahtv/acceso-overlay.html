<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AHtv · Activación</title>
  <style>
    * { box-sizing: border-box !important; }
    html, body {
      width: 100% !important;
      height: 100% !important;
      min-width: 0 !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: transparent !important;
      color: #fff !important;
      font-family: Arial, Helvetica, sans-serif !important;
    }
    .panel {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      border: 0 !important;
      border-radius: 7.18vw !important;
      background: rgba(3,4,5,.70) !important;
      color: #fff !important;
    }
    .neon-frame {
      position: absolute !important;
      inset: 0 !important;
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      pointer-events: none !important;
      z-index: 1 !important;
    }
    .frame-glow-green {
      fill: none;
      stroke: #25ff08;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#greenGlow);
    }
    .frame-core-green {
      fill: none;
      stroke: #efffe9;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .frame-glow-orange {
      fill: none;
      stroke: #ff5b00;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#orangeGlow);
    }
    .frame-core-orange {
      fill: none;
      stroke: #fff0d8;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .layout {
      position: absolute !important;
      inset: 5.64vw 5.13vw !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: flex-start !important;
      margin: 0 !important;
      padding: 0 !important;
      gap: 0 !important;
      z-index: 2 !important;
    }
    html body .panel #qr {
      position: relative !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex: none !important;
      width: 61.538vw !important;
      min-width: 61.538vw !important;
      max-width: 61.538vw !important;
      height: 61.538vw !important;
      min-height: 61.538vw !important;
      max-height: 61.538vw !important;
      margin: 3.077vw auto 2.564vw !important;
      padding: 2.564vw !important;
      overflow: hidden !important;
      border: 1px solid rgba(225,255,225,.95) !important;
      border-radius: 3.077vw !important;
      background: #fff !important;
      box-shadow: 0 0 3.077vw rgba(30,255,10,.68) !important;
      color: #111 !important;
      line-height: 0 !important;
      font-size: 10px !important;
      text-align: center !important;
    }
    html body .panel #qr canvas,
    html body .panel #qr img {
      flex: none !important;
      width: 56.41vw !important;
      min-width: 56.41vw !important;
      max-width: 56.41vw !important;
      height: 56.41vw !important;
      min-height: 56.41vw !important;
      max-height: 56.41vw !important;
      margin: 0 !important;
      padding: 0 !important;
      object-fit: contain !important;
      image-rendering: pixelated !important;
    }
    .copy {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      min-width: 0 !important;
      width: 100% !important;
      height: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: visible !important;
      text-align: center !important;
    }
    .title {
      margin: 0 0 1.538vw !important;
      padding: 0 !important;
      color: #fff !important;
      font-size: 9.231vw !important;
      line-height: 10.769vw !important;
      font-weight: 800 !important;
      letter-spacing: -.7px !important;
      white-space: nowrap !important;
    }
    .title .ah { color: #38ff08 !important; }
    .title .tv { color: #ff6400 !important; }
    .hint {
      width: 100% !important;
      max-width: 84.615vw !important;
      margin: 0 !important;
      padding: 0 !important;
      color: #f0f1f3 !important;
      font-size: 4.872vw !important;
      line-height: 6.41vw !important;
      font-weight: 600 !important;
      text-align: center !important;
      white-space: normal !important;
      overflow-wrap: normal !important;
    }
    .divider {
      display: block !important;
      flex: none !important;
      width: 100% !important;
      height: 0.513vw !important;
      margin: 3.077vw 0 3.077vw !important;
      padding: 0 !important;
      background: #36ff15 !important;
      box-shadow: 0 0 7px rgba(40,255,15,.72) !important;
    }
    .key-area {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      min-width: 0 !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: visible !important;
    }
    .key-label {
      display: block !important;
      margin: 0 0 1.538vw !important;
      padding: 0 !important;
      color: #fff !important;
      font-size: 5.385vw !important;
      line-height: 6.667vw !important;
      font-weight: 700 !important;
      text-align: center !important;
    }
    .key-box {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 100% !important;
      min-width: 0 !important;
      height: 16.41vw !important;
      margin: 0 !important;
      padding: 0 2.564vw !important;
      overflow: hidden !important;
      border: 2px solid transparent !important;
      border-radius: 2.821vw !important;
      background:
        linear-gradient(rgba(3,5,6,.98), rgba(3,5,6,.98)) padding-box,
        linear-gradient(100deg, #25ff08 0%, #8fff27 49%, #ff6500 54%, #ff4b00 100%) border-box !important;
      box-shadow: 0 0 8px rgba(35,255,10,.47), 0 0 7px rgba(255,83,0,.35) !important;
    }
    .code {
      display: block !important;
      flex: 0 1 auto !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      color: #b8ff39 !important;
      font-size: 7.436vw;
      line-height: 8.974vw !important;
      letter-spacing: 0 !important;
      font-weight: 800 !important;
      text-align: center !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: clip !important;
      overflow-wrap: normal !important;
    }
    .error {
      color: #ffb8b8 !important;
      font-size: 3.077vw !important;
      line-height: 3.846vw !important;
      white-space: normal !important;
    }
  </style>
</head>
<body>
  <div class="panel">
    <svg class="neon-frame" viewBox="0 0 390 640" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3.2" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3.2" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path class="frame-glow-green" d="M 350 16 H 42 Q 16 16 16 42 V 432"/>
      <path class="frame-core-green" d="M 350 16 H 42 Q 16 16 16 42 V 432"/>
      <path class="frame-glow-orange" d="M 16 432 V 578 Q 16 604 42 604 H 348 Q 374 604 374 578 V 42 Q 374 16 348 16"/>
      <path class="frame-core-orange" d="M 16 432 V 578 Q 16 604 42 604 H 348 Q 374 604 374 578 V 42 Q 374 16 348 16"/>
    </svg>
    <div class="layout">
      <div id="qr" aria-label="Código QR para solicitar música"></div>
      <div class="copy">
        <div class="title">Activa <span class="ah">AH</span><span class="tv">tv</span></div>
        <div class="hint">Escanea el código QR o ingresa<br>la clave en tu dispositivo para<br>enviar tu canción.</div>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="key-area">
        <div class="key-label">Clave de acceso</div>
        <div class="key-box"><div id="accessCode" class="code">Cargando clave…</div></div>
      </div>
    </div>
  </div>
  <script src="vendor/qrcode.min.js"></script>
  <script>
    (function () {
      // Consulta únicamente la clave pública vigente; no utiliza permisos administrativos.
      const SUPABASE_URL = 'https://tjarildqqxtjmafpiyuz.supabase.co';
      const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Clp6KIiLE-gKHGu3Lp8E2A_DxYhFBdT';
      const codeEl = document.getElementById('accessCode');
      const qrEl = document.getElementById('qr');
      const keyBox = codeEl.parentElement;
      const validCodePattern = /^[a-z]+(?:-[a-z]+){2}$/;
      const fallbackCode = String(new URLSearchParams(window.location.search).get('code') || '').trim().toLowerCase();
      let currentCode = '';
      let qrInstance = null;
      let renderedQrPixelSize = 0;
      let refreshInProgress = false;

      function currentQrPixelSize() {
        const scale = window.innerWidth / 390;
        return Math.max(64, Math.round(220 * scale));
      }

      function fitCodeToBox(value) {
        if (!value || !keyBox || !codeEl) return;
        const measure = document.createElement('canvas').getContext('2d');
        if (!measure) return;
        codeEl.style.fontSize = '';
        const availableWidth = Math.max(10, keyBox.clientWidth - 20);
        const baseSize = parseFloat(window.getComputedStyle(codeEl).fontSize) || 29;
        let size = baseSize;
        const minSize = Math.max(7.5, baseSize * 0.45);
        while (size > minSize) {
          measure.font = '800 ' + size + 'px Arial';
          if (measure.measureText(value).width <= availableWidth) break;
          size -= 0.25;
        }
        codeEl.style.fontSize = size + 'px';
      }

      function renderAccessCode(value) {
        const nextCode = String(value || '').trim().toLowerCase();
        if (!validCodePattern.test(nextCode) || typeof QRCode === 'undefined') return false;

        codeEl.classList.remove('error');
        codeEl.textContent = nextCode;
        fitCodeToBox(nextCode);

        const nextQrPixelSize = currentQrPixelSize();
        if (
          nextCode === currentCode &&
          qrInstance &&
          nextQrPixelSize === renderedQrPixelSize
        ) return true;

        currentCode = nextCode;
        renderedQrPixelSize = nextQrPixelSize;
        const target = new URL('/ahtv/index.html', window.location.origin);
        target.searchParams.set('access', nextCode);

        qrEl.innerHTML = '';
        qrInstance = new QRCode(qrEl, {
          text: target.toString(),
          width: nextQrPixelSize,
          height: nextQrPixelSize,
          colorDark: '#0c0d10',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
        return true;
      }

      async function refreshCurrentCode() {
        if (refreshInProgress || typeof QRCode === 'undefined') return;
        refreshInProgress = true;

        try {
          const response = await fetch(
            SUPABASE_URL + '/rest/v1/rpc/ahtv_overlay_obtener_clave_acceso',
            {
              method: 'POST',
              cache: 'no-store',
              headers: {
                'apikey': SUPABASE_PUBLISHABLE_KEY,
                'Content-Type': 'application/json'
              },
              body: '{}'
            }
          );

          if (!response.ok) {
            throw new Error('Respuesta HTTP ' + response.status);
          }

          const data = await response.json();
          const nextCode = String(data && data.code || '').trim().toLowerCase();
          if (!validCodePattern.test(nextCode) || !data.valid_until) {
            throw new Error('Supabase no devolvió una clave vigente válida.');
          }

          renderAccessCode(nextCode);
        } catch (error) {
          // Si la red falla temporalmente, se conserva la última clave y su QR.
          console.warn('AHtv: no fue posible actualizar la clave en este intento.', error);
        } finally {
          refreshInProgress = false;
        }
      }

      if (typeof QRCode === 'undefined') {
        codeEl.textContent = 'QR no disponible';
        codeEl.classList.add('error');
        qrEl.textContent = 'QR no disponible';
        return;
      }

      // El parámetro code permite mostrar algo inmediatamente; Supabase lo reemplaza
      // en cuanto responde con la clave real, aunque la URL de OBS no cambie.
      if (!renderAccessCode(fallbackCode)) {
        codeEl.textContent = 'Consultando clave…';
      }

      refreshCurrentCode();
      window.setInterval(refreshCurrentCode, 15000);
      window.addEventListener('focus', refreshCurrentCode);
      window.addEventListener('resize', function () {
        if (currentCode) renderAccessCode(currentCode);
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) refreshCurrentCode();
      });
    })();
  </script>
</body>
</html>
