<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AHtv · Acceso a música</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 600px;
      height: 178px;
      min-width: 600px;
      min-height: 178px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .panel {
      width: 600px;
      height: 178px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      padding: 10px 12px;
      overflow: hidden;
      border: 1px solid rgba(184,255,57,.55);
      border-radius: 13px;
      background: rgba(8,10,13,.96);
      box-shadow: 0 5px 18px rgba(0,0,0,.24);
      color: #fff;
    }
    #qr {
      position: relative;
      flex: 0 0 132px;
      width: 132px;
      min-width: 132px;
      height: 132px;
      min-height: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px;
      border-radius: 7px;
      background: #fff;
      color: #111;
      line-height: 0;
    }
    html body .panel #qr canvas,
    html body .panel #qr img {
      display: block !important;
      flex: none !important;
      width: 120px !important;
      min-width: 120px !important;
      max-width: 120px !important;
      height: 120px !important;
      min-height: 120px !important;
      max-height: 120px !important;
      object-fit: contain !important;
      image-rendering: pixelated;
    }
    .details { min-width: 0; flex: 1 1 auto; color: #fff; }
    .brand {
      color: #b8ff39;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 5px;
    }
    .title {
      color: #fff;
      font-size: 18px;
      line-height: 1.15;
      font-weight: 800;
      margin: 0 0 5px;
    }
    .hint {
      color: #d0d4da;
      font-size: 11px;
      line-height: 1.3;
      margin: 0 0 6px;
    }
    .code {
      color: #fff;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: .15px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .foot { color: #a0a6af; font-size: 9px; margin-top: 5px; }
    .error { color: #ffb8b8; font-size: 12px; line-height: 1.2; }
  </style>
</head>
<body>
  <div class="panel">
    <div id="qr" aria-label="Código QR para solicitar música"></div>
    <div class="details">
      <div class="brand">AvoHouse · AHtv</div>
      <div class="title">¿Quieres pedir una canción?</div>
      <div class="hint">Escanea el QR o escribe esta clave en AHtv.</div>
      <div id="accessCode" class="code">Cargando clave…</div>
      <div class="foot">El acceso se renueva automáticamente cada dos horas.</div>
    </div>
  </div>
  <script src="vendor/qrcode.min.js"></script>
  <script>
    (function () {
      const code = String(new URLSearchParams(window.location.search).get('code') || '').trim().toLowerCase();
      const codeEl = document.getElementById('accessCode');
      const qrEl = document.getElementById('qr');
      const valid = /^[a-z]+(?:-[a-z]+){2}$/.test(code);

      if (!valid || typeof QRCode === 'undefined') {
        codeEl.textContent = 'Clave no disponible';
        codeEl.classList.add('error');
        qrEl.textContent = 'QR no disponible';
        qrEl.style.color = '#111';
        qrEl.style.fontSize = '11px';
        qrEl.style.textAlign = 'center';
        return;
      }

      codeEl.textContent = code;
      const target = new URL('/ahtv/index.html', window.location.origin);
      target.searchParams.set('access', code);

      qrEl.style.setProperty('width', '132px', 'important');
      qrEl.style.setProperty('min-width', '132px', 'important');
      qrEl.style.setProperty('height', '132px', 'important');
      qrEl.style.setProperty('min-height', '132px', 'important');
      qrEl.style.setProperty('overflow', 'hidden', 'important');
      qrEl.style.setProperty('position', 'relative', 'important');

      new QRCode(qrEl, {
        text: target.toString(),
        width: 120,
        height: 120,
        colorDark: '#0c0d10',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      const lockQrSize = function () {
        qrEl.querySelectorAll('canvas, img').forEach(function (node) {
          ['width', 'min-width', 'max-width'].forEach(function (prop) {
            node.style.setProperty(prop, '120px', 'important');
          });
          ['height', 'min-height', 'max-height'].forEach(function (prop) {
            node.style.setProperty(prop, '120px', 'important');
          });
          node.style.setProperty('flex', 'none', 'important');
          node.style.setProperty('object-fit', 'contain', 'important');
          node.style.setProperty('display', 'block', 'important');
        });
      };

      const observer = new MutationObserver(lockQrSize);
      observer.observe(qrEl, { childList: true, subtree: true });
      lockQrSize();
      window.setTimeout(lockQrSize, 100);
      window.setTimeout(lockQrSize, 350);
    })();
  </script>
</body>
</html>
