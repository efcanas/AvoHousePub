<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AHtv · Acceso a música</title>
  <style>
    * { box-sizing: border-box !important; }
    html, body {
      width: 600px !important;
      height: 178px !important;
      min-width: 600px !important;
      min-height: 178px !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: transparent !important;
      background-color: transparent !important;
      color: #fff !important;
      font-family: Arial, Helvetica, sans-serif !important;
    }
    .panel {
      position: relative !important;
      display: block !important;
      width: 600px !important;
      height: 178px !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      border: 0 !important;
      border-radius: 27px !important;
      background: rgba(3,4,5,.96) !important;
      background-color: rgba(3,4,5,.96) !important;
      box-shadow: 0 5px 18px rgba(0,0,0,.24) !important;
      color: #fff !important;
    }
    .neon-frame {
      position: absolute !important;
      inset: 0 !important;
      display: block !important;
      width: 600px !important;
      height: 178px !important;
      overflow: visible !important;
      pointer-events: none !important;
      z-index: 1 !important;
    }
    .frame-glow-green {
      fill: none;
      stroke: #25ff08;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#greenGlow);
    }
    .frame-core-green {
      fill: none;
      stroke: #efffe9;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .frame-glow-orange {
      fill: none;
      stroke: #ff5b00;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#orangeGlow);
    }
    .frame-core-orange {
      fill: none;
      stroke: #fff0d8;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .copy {
      position: absolute !important;
      left: 23px !important;
      top: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      width: 249px !important;
      height: 178px !important;
      min-width: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      z-index: 2 !important;
    }
    .title {
      margin: 0 0 7px !important;
      padding: 0 !important;
      color: #fff !important;
      font-size: 27px !important;
      line-height: 32px !important;
      font-weight: 800 !important;
      letter-spacing: -.8px !important;
      white-space: nowrap !important;
    }
    .title .ah {
      color: #38ff08 !important;
    }
    .title .tv {
      color: #ff6400 !important;
    }
    .hint {
      margin: 0 !important;
      padding: 0 !important;
      color: #f0f1f3 !important;
      font-size: 11.5px !important;
      line-height: 15px !important;
      font-weight: 400 !important;
      overflow-wrap: normal !important;
    }
    .divider {
      position: absolute !important;
      left: 282px !important;
      top: 32px !important;
      display: block !important;
      width: 2px !important;
      height: 114px !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #36ff15 !important;
      box-shadow: 0 0 7px rgba(40,255,15,.72) !important;
      z-index: 2 !important;
    }
    html body .panel #qr {
      position: absolute !important;
      left: 294px !important;
      top: 33px !important;
      display: block !important;
      width: 112px !important;
      min-width: 112px !important;
      max-width: 112px !important;
      height: 112px !important;
      min-height: 112px !important;
      max-height: 112px !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      border: 1px solid rgba(225,255,225,.9) !important;
      border-radius: 8px !important;
      background: #fff !important;
      background-color: #fff !important;
      box-shadow: 0 0 10px rgba(30,255,10,.72) !important;
      color: #111 !important;
      line-height: 0 !important;
      z-index: 2 !important;
    }
    html body .panel #qr canvas,
    html body .panel #qr img {
      position: absolute !important;
      left: 7px !important;
      top: 7px !important;
      display: block !important;
      flex: none !important;
      width: 96px !important;
      min-width: 96px !important;
      max-width: 96px !important;
      height: 96px !important;
      min-height: 96px !important;
      max-height: 96px !important;
      margin: 0 !important;
      padding: 0 !important;
      object-fit: contain !important;
      image-rendering: pixelated !important;
    }
    .key-area {
      position: absolute !important;
      left: 420px !important;
      top: 54px !important;
      display: block !important;
      width: 160px !important;
      height: 70px !important;
      min-width: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      z-index: 2 !important;
    }
    .key-label {
      display: block !important;
      margin: 0 0 5px !important;
      padding: 0 !important;
      color: #fff !important;
      font-size: 13px !important;
      line-height: 16px !important;
      font-weight: 700 !important;
    }
    .key-box {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 160px !important;
      height: 47px !important;
      margin: 0 !important;
      padding: 0 6px !important;
      overflow: hidden !important;
      border: 2px solid transparent !important;
      border-radius: 9px !important;
      background:
        linear-gradient(rgba(3,5,6,.98), rgba(3,5,6,.98)) padding-box,
        linear-gradient(100deg, #25ff08 0%, #8fff27 49%, #ff6500 54%, #ff4b00 100%) border-box !important;
      box-shadow: 0 0 8px rgba(35,255,10,.47), 0 0 7px rgba(255,83,0,.35) !important;
    }
    .code {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      color: #b8ff39 !important;
      font-size: 12px !important;
      line-height: 16px !important;
      letter-spacing: 0 !important;
      font-weight: 800 !important;
      text-align: center !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: clip !important;
      overflow-wrap: normal !important;
    }
    .error {
      color: #ffb8b8 !important;
      font-size: 10px !important;
      line-height: 13px !important;
      white-space: normal !important;
    }
  </style>
</head>
<body>
  <div class="panel">
    <svg class="neon-frame" viewBox="0 0 600 178" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3.2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3.2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path class="frame-glow-green" d="M 548 10 H 30 Q 10 10 10 30 V 126"/>
      <path class="frame-core-green" d="M 548 10 H 30 Q 10 10 10 30 V 126"/>
      <path class="frame-glow-orange" d="M 10 126 V 148 Q 10 168 30 168 H 570 Q 590 168 590 148 V 30 Q 590 10 570 10 H 558"/>
      <path class="frame-core-orange" d="M 10 126 V 148 Q 10 168 30 168 H 570 Q 590 168 590 148 V 30 Q 590 10 570 10 H 558"/>
    </svg>
    <div class="copy">
      <div class="title">Activa <span class="ah">AH</span><span class="tv">tv</span></div>
      <div class="hint">Escanea el código QR o ingresa la clave en tu dispositivo para enviar tu canción.</div>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <div id="qr" aria-label="Código QR para solicitar música"></div>
    <div class="key-area">
      <div class="key-label">Clave:</div>
      <div class="key-box">
        <div id="accessCode" class="code">Cargando clave…</div>
      </div>
    </div>
  </div>
  <script src="vendor/qrcode.min.js"></script>
  <script>
    (function () {
      const code = String(new URLSearchParams(window.location.search).get('code') || '').trim().toLowerCase();
      const codeEl = document.getElementById('accessCode');
      const qrEl = document.getElementById('qr');
      const valid = /^[a-z]+(?:-[a-z]+){2}$/.test(code);

      if (!valid || typeof QRCode === 'undefined') {
        codeEl.textContent = 'Clave no disponible';
        codeEl.classList.add('error');
        qrEl.textContent = 'QR no disponible';
        qrEl.style.color = '#111';
        qrEl.style.fontSize = '11px';
        qrEl.style.lineHeight = 'normal';
        qrEl.style.textAlign = 'center';
        return;
      }

      codeEl.textContent = code;
      const target = new URL('/ahtv/index.html', window.location.origin);
      target.searchParams.set('access', code);

      // The surrounding white area provides a clear quiet zone for phone cameras.
      qrEl.replaceChildren();
      new QRCode(qrEl, {
        text: target.toString(),
        width: 96,
        height: 96,
        colorDark: '#0c0d10',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      const lockQrSize = function () {
        qrEl.querySelectorAll('canvas, img').forEach(function (node) {
          node.style.setProperty('position', 'absolute', 'important');
          node.style.setProperty('left', '7px', 'important');
          node.style.setProperty('top', '7px', 'important');
          ['width', 'min-width', 'max-width'].forEach(function (prop) {
            node.style.setProperty(prop, '96px', 'important');
          });
          ['height', 'min-height', 'max-height'].forEach(function (prop) {
            node.style.setProperty(prop, '96px', 'important');
          });
          node.style.setProperty('flex', 'none', 'important');
          node.style.setProperty('object-fit', 'contain', 'important');
          node.style.setProperty('display', 'block', 'important');
          node.style.setProperty('margin', '0', 'important');
          node.style.setProperty('padding', '0', 'important');
        });
      };

      const observer = new MutationObserver(lockQrSize);
      observer.observe(qrEl, { childList: true, subtree: true });
      lockQrSize();
      window.setTimeout(lockQrSize, 100);
      window.setTimeout(lockQrSize, 350);
    })();
  </script>
</body>
</html>
