<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AHtv · Acceso a música</title>
  <style>
    * { box-sizing: border-box !important; }
    html, body {
      width: 600px !important;
      height: 178px !important;
      min-width: 600px !important;
      min-height: 178px !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: transparent !important;
      background-color: transparent !important;
      color: #fff !important;
      font-family: Arial, Helvetica, sans-serif !important;
    }
    .panel {
      position: relative !important;
      display: block !important;
      width: 600px !important;
      height: 178px !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      border: 1px solid rgba(184,255,57,.55) !important;
      border-radius: 13px !important;
      background: rgba(8,10,13,.96) !important;
      background-color: rgba(8,10,13,.96) !important;
      box-shadow: 0 5px 18px rgba(0,0,0,.24) !important;
      color: #fff !important;
    }
    html body .panel #qr {
      position: absolute !important;
      left: 9px !important;
      top: 2px !important;
      display: block !important;
      width: 172px !important;
      min-width: 172px !important;
      max-width: 172px !important;
      height: 172px !important;
      min-height: 172px !important;
      max-height: 172px !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      border-radius: 7px !important;
      background: #fff !important;
      background-color: #fff !important;
      color: #111 !important;
      line-height: 0 !important;
    }
    html body .panel #qr canvas,
    html body .panel #qr img {
      position: absolute !important;
      left: 18px !important;
      top: 18px !important;
      display: block !important;
      flex: none !important;
      width: 136px !important;
      min-width: 136px !important;
      max-width: 136px !important;
      height: 136px !important;
      min-height: 136px !important;
      max-height: 136px !important;
      margin: 0 !important;
      padding: 0 !important;
      object-fit: contain !important;
      image-rendering: pixelated !important;
    }
    .details {
      position: absolute !important;
      left: 194px !important;
      top: 27px !important;
      right: 12px !important;
      display: block !important;
      width: auto !important;
      height: 128px !important;
      min-width: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      color: #fff !important;
    }
    .brand {
      color: #b8ff39 !important;
      font-size: 10px !important;
      font-weight: 700 !important;
      letter-spacing: 2px !important;
      line-height: 12px !important;
      text-transform: uppercase !important;
      margin: 0 0 5px !important;
      padding: 0 !important;
    }
    .title {
      color: #fff !important;
      font-size: 18px !important;
      line-height: 21px !important;
      font-weight: 800 !important;
      margin: 0 0 5px !important;
      padding: 0 !important;
    }
    .hint {
      color: #d0d4da !important;
      font-size: 11px !important;
      line-height: 14px !important;
      margin: 0 0 6px !important;
      padding: 0 !important;
    }
    .code {
      color: #fff !important;
      font-size: 20px !important;
      line-height: 23px !important;
      letter-spacing: .15px !important;
      font-weight: 800 !important;
      overflow-wrap: anywhere !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .foot {
      color: #a0a6af !important;
      font-size: 9px !important;
      line-height: 11px !important;
      margin: 5px 0 0 !important;
      padding: 0 !important;
    }
    .error {
      color: #ffb8b8 !important;
      font-size: 12px !important;
      line-height: 14px !important;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div id="qr" aria-label="Código QR para solicitar música"></div>
    <div class="details">
      <div class="brand">AvoHouse · AHtv</div>
      <div class="title">¿Quieres pedir una canción?</div>
      <div class="hint">Escanea el QR o escribe esta clave en AHtv.</div>
      <div id="accessCode" class="code">Cargando clave…</div>
      <div class="foot">El acceso se renueva automáticamente cada dos horas.</div>
    </div>
  </div>
  <script src="vendor/qrcode.min.js"></script>
  <script>
    (function () {
      const code = String(new URLSearchParams(window.location.search).get('code') || '').trim().toLowerCase();
      const codeEl = document.getElementById('accessCode');
      const qrEl = document.getElementById('qr');
      const valid = /^[a-z]+(?:-[a-z]+){2}$/.test(code);

      if (!valid || typeof QRCode === 'undefined') {
        codeEl.textContent = 'Clave no disponible';
        codeEl.classList.add('error');
        qrEl.textContent = 'QR no disponible';
        qrEl.style.color = '#111';
        qrEl.style.fontSize = '11px';
        qrEl.style.lineHeight = 'normal';
        qrEl.style.textAlign = 'center';
        return;
      }

      codeEl.textContent = code;
      const target = new URL('/ahtv/index.html', window.location.origin);
      target.searchParams.set('access', code);

      // The surrounding white area provides a clear quiet zone for phone cameras.
      qrEl.replaceChildren();
      new QRCode(qrEl, {
        text: target.toString(),
        width: 136,
        height: 136,
        colorDark: '#0c0d10',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      const lockQrSize = function () {
        qrEl.querySelectorAll('canvas, img').forEach(function (node) {
          node.style.setProperty('position', 'absolute', 'important');
          node.style.setProperty('left', '18px', 'important');
          node.style.setProperty('top', '18px', 'important');
          ['width', 'min-width', 'max-width'].forEach(function (prop) {
            node.style.setProperty(prop, '136px', 'important');
          });
          ['height', 'min-height', 'max-height'].forEach(function (prop) {
            node.style.setProperty(prop, '136px', 'important');
          });
          node.style.setProperty('flex', 'none', 'important');
          node.style.setProperty('object-fit', 'contain', 'important');
          node.style.setProperty('display', 'block', 'important');
          node.style.setProperty('margin', '0', 'important');
          node.style.setProperty('padding', '0', 'important');
        });
      };

      const observer = new MutationObserver(lockQrSize);
      observer.observe(qrEl, { childList: true, subtree: true });
      lockQrSize();
      window.setTimeout(lockQrSize, 100);
      window.setTimeout(lockQrSize, 350);
    })();
  </script>
</body>
</html>
