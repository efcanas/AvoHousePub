<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Helvetica Neue', Arial, sans-serif;
color:white;
background:url('Fondo.webp') center/cover fixed no-repeat;
padding-top:300px;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
z-index:-1;
}

/* Encabezado compartido con Administración */

/* CONTENIDO */

.container{
max-width:1000px;
margin:18px auto 80px auto;
padding:0 20px;
}

.product-grid{
display:grid;
grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
gap:35px;
}

.product-card{
text-align:center;
}

.product-card img{
width:100%;
border-radius:12px;
margin-bottom:15px;
transition:transform 0.3s ease, box-shadow 0.3s ease;
}

.product-card img:hover{
transform:scale(1.12);
}

/* Neon aqua */

.neon-sin{
box-shadow:0 0 10px #7fffd4, 0 0 22px #7fffd4;
}

.product-name{
font-size:1.05em;
margin-bottom:6px;
letter-spacing:1px;
}

.price{
font-size:0.95em;
color:#e0e0e0;
}

.back{
display:block;
text-align:center;
margin-top:60px;
color:#ccc;
text-decoration:none;
font-size:0.9em;
}

.back:hover{
color:white;
}




/* Galería ampliada de imágenes del menú */
.product-card img{
  cursor:zoom-in;
}
.product-card img:focus-visible{
  outline:2px solid #d4af37;
  outline-offset:3px;
}
.image-lightbox[hidden]{
  display:none !important;
}
.image-lightbox{
  position:fixed;
  inset:0;
  z-index:3000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 14px calc(24px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.94);
  backdrop-filter:blur(8px);
}
.image-lightbox-content{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  max-width:100%;
}
.image-lightbox-image{
  display:block;
  width:auto;
  height:auto;
  max-width:94vw;
  max-height:calc(100vh - 115px);
  max-height:calc(100dvh - 115px);
  object-fit:contain;
  border-radius:12px;
  box-shadow:0 18px 60px rgba(0,0,0,.65);
}
.image-lightbox-caption{
  max-width:92vw;
  color:#fff;
  text-align:center;
  font-size:15px;
  line-height:1.4;
}
.image-lightbox-close{
  position:absolute;
  top:calc(env(safe-area-inset-top) + 14px);
  right:16px;
  z-index:1;
  display:grid;
  place-items:center;
  width:44px;
  height:44px;
  margin:0;
  padding:0;
  border:1px solid rgba(255,255,255,.35);
  border-radius:50%;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:28px;
  font-weight:400;
  line-height:1;
  cursor:pointer;
}
@media(max-width:640px){
  .product-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 12px;
  }
  .product-card{
    min-width:0;
  }
  .product-card img{
    width:100%;
    margin-bottom:10px;
  }
  .product-card img:hover{
    transform:none;
  }
  .product-name{
    font-size:.95em;
    line-height:1.3;
  }
  .ingredients{
    font-size:.8em;
  }
  .price{
    font-size:.9em;
  }
}

</style>

<div id="productImageLightbox" class="image-lightbox" role="dialog" aria-modal="true" aria-label="Imagen ampliada" hidden>
  <button id="productImageLightboxClose" class="image-lightbox-close" type="button" aria-label="Cerrar imagen ampliada">×</button>
  <div class="image-lightbox-content">
    <img id="productImageLightboxImage" class="image-lightbox-image" alt="">
    <div id="productImageLightboxCaption" class="image-lightbox-caption"></div>
  </div>
</div>

<script>
(function(){
  const lightbox = document.getElementById("productImageLightbox");
  const enlargedImage = document.getElementById("productImageLightboxImage");
  const caption = document.getElementById("productImageLightboxCaption");
  const closeButton = document.getElementById("productImageLightboxClose");
  if (!lightbox || !enlargedImage || !caption || !closeButton) return;

  let previousFocus = null;
  let previousOverflow = "";

  function getLabel(img){
    const productName = img.closest(".product-card")?.querySelector(".product-name")?.textContent?.trim();
    const alt = img.getAttribute("alt")?.trim();
    let filename = (img.getAttribute("src") || "").split("/").pop() || "";
    try { filename = decodeURIComponent(filename); } catch (_) {}
    filename = filename.replace(/\.[^.]+$/, "").replace(/^CC(?=[A-Z])/, "CC ")
      .replace(/([a-záéíóúñ])([A-ZÁÉÍÓÚÑ])/g, "$1 $2");
    return productName || alt || filename || "Imagen del menú";
  }

  function openLightbox(img){
    previousFocus = img;
    previousOverflow = document.body.style.overflow;
    const label = getLabel(img);
    enlargedImage.src = img.currentSrc || img.src;
    enlargedImage.alt = label;
    caption.textContent = label;
    caption.hidden = !label;
    lightbox.hidden = false;
    document.body.style.overflow = "hidden";
    closeButton.focus({preventScroll:true});
  }

  function closeLightbox(){
    lightbox.hidden = true;
    enlargedImage.removeAttribute("src");
    enlargedImage.alt = "";
    caption.textContent = "";
    document.body.style.overflow = previousOverflow;
    if (previousFocus && document.contains(previousFocus)) {
      previousFocus.focus({preventScroll:true});
    }
  }

  document.querySelectorAll(".product-card img").forEach(function(img){
    img.tabIndex = 0;
    img.setAttribute("role", "button");
    img.setAttribute("aria-label", "Ampliar imagen: " + getLabel(img));
    img.addEventListener("click", function(){ openLightbox(img); });
    img.addEventListener("keydown", function(event){
      if (event.key === "Enter" || event.key === " " || event.key === "Spacebar") {
        event.preventDefault();
        openLightbox(img);
      }
    });
  });

  closeButton.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", function(event){
    if (event.target === lightbox) closeLightbox();
  });
  document.addEventListener("keydown", function(event){
    if (!lightbox.hidden && event.key === "Escape") closeLightbox();
  });
})();
</script>
