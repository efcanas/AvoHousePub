<title>Sin Alcohol | AvoHouse Pub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Helvetica Neue', Arial, sans-serif;
color:white;
background:url('Fondo.webp') center/cover fixed no-repeat;
padding-top:300px;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
z-index:-1;
}

/* Encabezado compartido con Administración */

/* CONTENIDO */

.container{
max-width:1000px;
margin:18px auto 80px auto;
padding:0 20px;
}

.product-grid{
display:grid;
grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
gap:35px;
}

.product-card{
text-align:center;
}

.product-card img{
width:100%;
border-radius:12px;
margin-bottom:15px;
transition:transform 0.3s ease, box-shadow 0.3s ease;
}

.product-card img:hover{
transform:scale(1.12);
}

/* Neon aqua */

.neon-sin{
box-shadow:0 0 10px #7fffd4, 0 0 22px #7fffd4;
}

.product-name{
font-size:1.05em;
margin-bottom:6px;
letter-spacing:1px;
}

.price{
font-size:0.95em;
color:#e0e0e0;
}

.back{
display:block;
text-align:center;
margin-top:60px;
color:#ccc;
text-decoration:none;
font-size:0.9em;
}

.back:hover{
color:white;
}



</style>
