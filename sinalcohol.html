<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin Alcohol | AvoHouse Pub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Helvetica Neue', Arial, sans-serif;
color:white;
background:url('Fondo.webp') center/cover fixed no-repeat;
padding-top:260px;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
z-index:-1;
}

/* ENCABEZADO Y NAVEGACIÓN: vista pública del menú */
.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  text-align:center;
  padding:25px 20px 15px;
  background:rgba(0,0,0,.86);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.header .logo{
  display:block;
  width:260px;
  max-width:90%;
  height:auto;
  margin:0 auto 8px;
}
.header-title{
  margin:0 0 15px;
  color:#d4af37;
  font-size:1.4em;
  line-height:1.2;
  letter-spacing:3px;
  white-space:nowrap;
}
.header-subtitle{
  display:none;
}
.header-actions{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:nowrap;
  gap:12px;
  width:100%;
  max-width:100%;
  margin:0;
  padding:10px 0;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.header-actions::-webkit-scrollbar{
  display:none;
}
.home-button{
  display:inline-flex;
  flex:0 0 auto;
  align-items:center;
  justify-content:center;
  padding:10px 18px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:30px;
  color:#fff;
  background:transparent;
  font-size:.85em;
  line-height:1.2;
  text-decoration:none;
  white-space:nowrap;
  transition:background .2s ease,color .2s ease,border-color .2s ease;
}
.home-button:hover{
  background:#fff;
  color:#111;
}
.home-button.active{
  border-color:#d4af37;
  background:rgba(212,175,55,.15);
  color:#d4af37;
  font-weight:600;
}
@media(max-width:640px){
  body{padding-top:220px;}
  .container{margin-top:28px;}
  .header{
    padding:18px 0 12px;
  }
  .header .logo{
    width:200px;
    max-width:90%;
    margin-bottom:8px;
  }
  .header-title{
    margin-bottom:10px;
    font-size:22px;
    line-height:1.2;
  }
  .header-actions{
    justify-content:flex-start;
    gap:12px;
    padding:10px 20px;
  }
}

/* CONTENIDO */

.container{
max-width:1000px;
margin:46px auto 80px auto;
padding:0 20px;
}

.product-grid{
display:grid;
grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
gap:35px;
}

.product-card{
text-align:center;
}

.product-card img{
width:100%;
border-radius:12px;
margin-bottom:15px;
transition:transform 0.3s ease, box-shadow 0.3s ease;
}

.product-card img:hover{
transform:scale(1.12);
}

/* Neon aqua */

.neon-sin{
box-shadow:0 0 10px #7fffd4, 0 0 22px #7fffd4;
}

.product-name{
font-size:1.05em;
margin-bottom:6px;
letter-spacing:1px;
}

.price{
font-size:0.95em;
color:#e0e0e0;
}

.back{
display:block;
text-align:center;
margin-top:60px;
color:#ccc;
text-decoration:none;
font-size:0.9em;
}

.back:hover{
color:white;
}




/* Galería ampliada de imágenes del menú */
.product-card img{
  cursor:zoom-in;
}
.product-card img:focus-visible{
  outline:2px solid #d4af37;
  outline-offset:3px;
}
.image-lightbox[hidden]{
  display:none !important;
}
.image-lightbox{
  position:fixed;
  inset:0;
  z-index:3000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 14px calc(24px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.94);
  backdrop-filter:blur(8px);
}
.image-lightbox-content{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  max-width:100%;
}
.image-lightbox-image{
  display:block;
  cursor:zoom-out;
  width:auto;
  height:auto;
  max-width:94vw;
  max-height:calc(100vh - 115px);
  max-height:calc(100dvh - 115px);
  object-fit:contain;
  border-radius:12px;
  box-shadow:0 18px 60px rgba(0,0,0,.65);
}
@media(max-width:640px){
  .product-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 12px;
  }
  .product-card{
    min-width:0;
  }
  .product-card img{
    width:100%;
    margin-bottom:10px;
  }
  .product-card img:hover{
    transform:none;
  }
  .product-name{
    font-size:.95em;
    line-height:1.3;
  }
  .ingredients{
    font-size:.8em;
  }
  .price{
    font-size:.9em;
  }
}


/* Estado y avisos del catálogo dinámico */
body.menu-data-pending[data-menu-section="firma"] #menuContent{visibility:hidden}
body.menu-data-pending[data-menu-section="firma"] .spacer{visibility:hidden}
.menu-status{
  margin:8px auto 24px;
  padding:20px 18px;
  max-width:720px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  background:rgba(0,0,0,.35);
  color:#e8e8e8;
  text-align:center;
  font-size:14px;
  line-height:1.55;
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="menu-public.js?v=20261023-3" defer></script>
</head>

</div>

</body>
</html>
