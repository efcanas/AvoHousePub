<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firma de la Casa | AvoHouse Pub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Helvetica Neue', Arial, sans-serif;
color:white;
background:url('Fondo.webp') center/cover fixed no-repeat;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
z-index:-1;
}

/* Encabezado compartido con Administración */

/* ESPACIADOR */

.spacer{
height:220px;
}

/* CONTENIDO */

.container{
max-width:1100px;
margin:0 auto 80px auto;
padding:0 20px;
}

.product-grid{
display:grid;
grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
gap:40px;
}

.product-card{
text-align:center;
}

.product-card img{
width:100%;
border-radius:12px;
margin-bottom:15px;
transition:transform 0.3s ease, box-shadow 0.3s ease;
}

.product-card img:hover{
transform:scale(1.12);
}

/* Neón ámbar */
.neon-firma{
box-shadow:0 0 12px #ffb347, 0 0 25px #ffb347;
}

.product-name{
font-size:1.05em;
margin-bottom:6px;
letter-spacing:1px;
}

.price{
font-size:0.95em;
color:#e0e0e0;
}

.back{
display:block;
text-align:center;
margin-top:60px;
color:#ccc;
text-decoration:none;
font-size:0.9em;
}

.back:hover{
color:white;
}



</style>
<link rel="stylesheet" href="cuenta/admin/header.css?v=20261004-2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</head>

<body>

<a href="index.html" class="back">← Volver al inicio</a>

</div>

<script>
const header = document.querySelector(".header");
const spacer = document.querySelector(".spacer");

function adjustSpacer(){
  spacer.style.height = (header.offsetHeight + 40) + "px";
}

window.addEventListener("load", adjustSpacer);
window.addEventListener("resize", adjustSpacer);
</script>


<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
