<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preload" as="image" href="../Fondo.png" fetchpriority="high">
<title>AvoHouse · Registrarse</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:'Helvetica Neue',Arial,sans-serif;color:#fff;background:url('../Fondo.png') center/cover fixed no-repeat}
body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:-1}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
.shell{width:100%;max-width:460px}
.back{display:inline-block;margin:0 0 18px 4px;color:#fff;text-decoration:none;font-size:13px;letter-spacing:1px;opacity:.8}
.back:hover{opacity:1}
.card{background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.17);border-radius:22px;padding:30px;backdrop-filter:blur(7px);box-shadow:0 18px 60px rgba(0,0,0,.24)}
.logo{display:block;width:125px;max-width:45%;margin:0 auto 18px}
.kicker{text-align:center;text-transform:uppercase;letter-spacing:3px;font-size:11px;opacity:.72;margin-bottom:8px}
h1{text-align:center;font-size:28px;margin:0 0 8px}
.subtitle{text-align:center;color:#c9c9c9;line-height:1.5;font-size:14px;margin:0 0 25px}
.field{display:block;font-size:14px;font-weight:600;margin:0 0 15px}
.field input,.field select{width:100%;margin-top:7px;padding:12px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;font:inherit}
.field select option{color:#111}
.field input:focus,.field select:focus{outline:2px solid rgba(255,255,255,.18);border-color:rgba(255,255,255,.65)}
.password-row{position:relative}
.password-row input{padding-right:78px}
.toggle-password{position:absolute;right:9px;bottom:9px;border:0;background:transparent;color:#ddd;font-size:12px;cursor:pointer;padding:5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.radio-group{display:flex;align-items:center;gap:26px;margin-top:8px}
.radio-option{display:flex;align-items:center;gap:7px;font-size:14px;color:#ddd;line-height:1}
.radio-option input{margin:0}
.hidden{display:none!important}
.consent{border-top:1px solid rgba(255,255,255,.13);padding-top:14px;margin-top:14px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#ddd;line-height:1.45;margin:12px 0}
.check input{margin-top:3px}
.legal-box{margin-top:24px;border-top:1px solid rgba(255,255,255,.13);padding-top:22px}
.legal-heading{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.legal-icon{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.legal-heading h2{margin:0;font-size:16px;letter-spacing:1.8px;text-transform:uppercase}
.legal-item{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#ddd;line-height:1.5;margin:13px 0}
.legal-item input{margin:3px 0 0;flex:0 0 auto}
.legal-item a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.primary,.secondary{display:block;width:100%;border-radius:11px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;transition:.2s;text-align:center;text-decoration:none}
.primary{background:#fff;color:#111;border:1px solid #fff}
.primary:hover:not(:disabled){filter:brightness(.94)}
.primary:disabled{opacity:.35;cursor:not-allowed}
.secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);margin-top:10px}
.secondary:hover{background:rgba(255,255,255,.07)}
.notice{display:none;margin:0 0 15px;padding:11px 12px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);font-size:13px;line-height:1.45;color:#ddd}
.notice.show{display:block}
.small{font-size:11px;color:#aaa;line-height:1.45;margin-top:12px}
.requirement-status{font-size:12px;line-height:1.45;color:#aaa;text-align:center;margin:10px 6px 0;min-height:18px}
.username-status{font-size:12px;line-height:1.45;color:#aaa;margin-top:6px}.username-status.ok{color:#bfe8c8}.username-status.bad{color:#ffb7b7}
.requirement-status.ready{color:#ddd}
@media(max-width:480px){.card{padding:23px 19px}.row{grid-template-columns:1fr}.logo{width:105px}}
</style>
</head>
<body>
<div class="page">
<div class="shell">
<a class="back" href="ingresar.html">← Volver a ingresar</a>
<div class="card">
<img class="logo" src="../LogoPrincipal.png" alt="AvoHouse">
<div class="kicker">Puntos AH</div>
<h1>Crear cuenta</h1>
<p class="subtitle">Completa tus datos para crear tu cuenta de AvoHouse.</p>
<div id="registerNotice" class="notice"></div>

<form id="registerForm" novalidate>
<label class="field">Nombre completo *
<input name="nombre" autocomplete="name" required>
</label>

<label class="field">Nickname público *
<input id="username" name="username" maxlength="20" autocomplete="off" autocapitalize="none" spellcheck="false" required placeholder="Ej. AvoLover82">
<div id="usernameStatus" class="small">Será tu identidad pública en AvoHouse. Debe tener entre 3 y 20 caracteres, usar solo letras, números o guion bajo y no se podrá cambiar después.</div>
</label>

<div class="row">
<label class="field">Tipo de documento *
<select name="tipo_documento" required>
<option value="">Selecciona</option>
<option>Cédula de ciudadanía</option>
<option>Cédula de extranjería</option>
<option>Pasaporte</option>
</select>
</label>
<label class="field">Número de documento *
<input name="documento" inputmode="numeric" autocomplete="off" required>
</label>
</div>

<label class="field">Correo electrónico *
<input name="correo" type="email" autocomplete="email" required>
</label>

<label class="field">Número de celular *
<input name="telefono" inputmode="tel" autocomplete="tel" required>
</label>

<label class="field">¿Este número también corresponde a tu WhatsApp? *
<span class="radio-group">
<label class="radio-option"><input type="radio" name="wa_mismo" value="si" required> Sí</label>
<label class="radio-option"><input type="radio" name="wa_mismo" value="no"> No</label>
</span>
</label>

<div id="waWrap" class="hidden">
<label class="field">Número de WhatsApp *
<input id="whatsapp" name="whatsapp" inputmode="tel" autocomplete="tel">
</label>
</div>

<label class="field password-row">Contraseña *
<input id="regPassword" name="password" type="password" minlength="8" autocomplete="new-password" required>
<button class="toggle-password" type="button" data-target="regPassword" onclick="togglePassword(this);return false;">Mostrar</button>
</label>
<p class="small" style="margin-top:-7px;margin-bottom:14px">Mínimo 8 caracteres, una mayúscula, una minúscula y un número.</p>

<label class="field password-row">Confirmar contraseña *
<input id="regPasswordConfirm" name="password_confirm" type="password" minlength="8" autocomplete="new-password" required>
<button class="toggle-password" type="button" data-target="regPasswordConfirm" onclick="togglePassword(this);return false;">Mostrar</button>
</label>

<div class="consent">
<label class="check"><input type="checkbox" name="mayor_18" required><span>Declaro que soy mayor de 18 años.</span></label>
</div>

<div class="legal-box">
<div class="legal-heading"><div class="legal-icon">✓</div><h2>Términos y condiciones</h2></div>
<label class="legal-item">
<input type="checkbox" name="terminos" required>
<span>Acepto los <a href="../legal/terminos.html" target="_blank" rel="noopener">Términos y Condiciones</a> y autorizo a AvoHouse al tratamiento de mis datos personales conforme a la <a href="../legal/politica-datos.html" target="_blank" rel="noopener">Política de Tratamiento de Datos</a>.</span>
</label>
<label class="legal-item">
<input type="checkbox" name="publicidad">
<span>Autorizo el envío de comunicaciones comerciales y publicitarias por correo electrónico, SMS y WhatsApp.</span>
</label>
</div>

<button id="registerBtn" class="primary" type="submit" disabled>Crear mi cuenta</button>
<div id="requirementStatus" class="requirement-status" aria-live="polite"></div>
<a class="secondary" href="ingresar.html">Volver a ingresar</a>
</form>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const ACCOUNT_URL=new URL('../index.html',window.location.href).href;
const registerForm=document.getElementById('registerForm');
const registerBtn=document.getElementById('registerBtn');
const status=document.getElementById('requirementStatus');
const waWrap=document.getElementById('waWrap');
const waInput=document.getElementById('whatsapp');
const registerNotice=document.getElementById('registerNotice');
const usernameInput=document.getElementById('username');
const usernameStatus=document.getElementById('usernameStatus');
let nicknameAvailable=false;
let nicknameTimer=null;

function field(name){return registerForm.elements[name]}
function waChoice(){
  const selected=registerForm.querySelector('input[name="wa_mismo"]:checked');
  return selected?selected.value:'';
}
function passwordChecks(){
  const p=field('password').value;
  return {length:p.length>=8,upper:/[A-ZÁÉÍÓÚÜÑ]/.test(p),lower:/[a-záéíóúüñ]/.test(p),number:/\d/.test(p),match:p.length>0&&p===field('password_confirm').value};
}
function getMissing(){
  const missing=[];
  [['nombre','nombre completo'],['tipo_documento','tipo de documento'],['documento','número de documento'],['correo','correo electrónico'],['telefono','número de celular'],['username','nickname']].forEach(([n,l])=>{if(!field(n).value.trim())missing.push(l)});
  const nick=field('username').value.trim();
  if(nick && !/^[A-Za-z0-9_]{3,20}$/.test(nick))missing.push('un nickname válido');
  else if(nick && !nicknameAvailable)missing.push('un nickname disponible');
  if(field('correo').value.trim()&&!field('correo').checkValidity())missing.push('un correo electrónico válido');
  const wa=waChoice();
  if(!wa)missing.push('seleccionar si el celular también es WhatsApp');
  if(wa==='no'&&!waInput.value.trim())missing.push('número de WhatsApp');
  const p=passwordChecks();
  if(!p.length)missing.push('una contraseña de mínimo 8 caracteres');
  else{if(!p.upper)missing.push('una mayúscula en la contraseña');if(!p.lower)missing.push('una minúscula en la contraseña');if(!p.number)missing.push('un número en la contraseña')}
  if(field('password_confirm').value&&!p.match)missing.push('que las contraseñas coincidan');
  if(!field('mayor_18').checked)missing.push('aceptar mayoría de edad');
  if(!field('terminos').checked)missing.push('aceptar los Términos y Condiciones');
  return missing;
}
function updateRegisterButton(){
  const missing=getMissing();
  const ready=missing.length===0;
  registerBtn.disabled=!ready;
  if(ready){status.textContent='Todo listo. Puedes crear tu cuenta.';status.classList.add('ready')}
  else{status.classList.remove('ready');const first=missing.slice(0,2).join(' y ');const extra=missing.length>2?' y '+(missing.length-2)+' requisito'+(missing.length-2===1?'':'s')+' más':'';status.textContent='Falta: '+first+extra+'.'}
}
registerForm.querySelectorAll('input,select').forEach(el=>{el.addEventListener('input',updateRegisterButton);el.addEventListener('change',updateRegisterButton)});
usernameInput.addEventListener('input',()=>{
  nicknameAvailable=false;
  clearTimeout(nicknameTimer);
  const nick=usernameInput.value.trim();
  usernameStatus.className='small username-status';
  if(!nick){usernameStatus.textContent='Será tu identidad pública en AvoHouse. No se podrá cambiar después.';updateRegisterButton();return;}
  if(!/^[A-Za-z0-9_]{3,20}$/.test(nick)){
    usernameStatus.classList.add('bad');
    usernameStatus.textContent='Usa entre 3 y 20 caracteres: solo letras, números o guion bajo.';
    updateRegisterButton();return;
  }
  usernameStatus.textContent='Comprobando disponibilidad…';
  nicknameTimer=setTimeout(async()=>{
    try{
      const {data,error}=await supabaseClient.rpc('ahtv_nickname_disponible',{p_username:nick});
      if(error)throw error;
      nicknameAvailable=data===true;
      usernameStatus.className='small username-status '+(nicknameAvailable?'ok':'bad');
      usernameStatus.textContent=nicknameAvailable?'Nickname disponible.':'Ese nickname no está disponible. Elige otro.';
    }catch(error){
      nicknameAvailable=false;
      usernameStatus.className='small username-status bad';
      usernameStatus.textContent='No se pudo comprobar el nickname. Inténtalo nuevamente.';
    }
    updateRegisterButton();
  },350);
});
registerForm.querySelectorAll('input[name="wa_mismo"]').forEach(radio=>radio.addEventListener('change',()=>{
  const same=waChoice()==='si';
  waWrap.classList.toggle('hidden',same);
  waInput.required=!same;
  if(same)waInput.value='';
  updateRegisterButton();
}));
function togglePassword(button){
  const input=document.getElementById(button.getAttribute('data-target'));
  if(!input)return;
  const visible=input.type==='text';
  input.type=visible?'password':'text';
  button.textContent=visible?'Mostrar':'Ocultar';
}
let supabaseClient=null;
if(window.supabase?.createClient){
  supabaseClient=window.supabase.createClient(
    'https://tjarildqqxtjmafpiyuz.supabase.co',
    'sb_publishable_Clp6KIiLE-gKHGu3Lp8E2A_DxYhFBdT',
    {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
  );
}else{
  registerNotice.textContent='No fue posible cargar el servicio de cuenta. Recarga la página e inténtalo nuevamente.';
  registerNotice.classList.add('show');
}

registerForm.addEventListener('submit',async e=>{
  e.preventDefault();
  updateRegisterButton();
  if(registerBtn.disabled||!supabaseClient)return;
  registerBtn.disabled=true;
  registerNotice.textContent='Procesando el registro…';
  registerNotice.classList.add('show');
  try{

  const fullName=field('nombre').value.trim();
  const username=field('username').value.trim();
  const documentType=field('tipo_documento').value;
  const documentNumber=field('documento').value.trim();
  const email=field('correo').value.trim().toLowerCase();
  const phone=field('telefono').value.trim();
  const same=waChoice()==='si';
  const whatsapp=same?phone:waInput.value.trim();
  const password=field('password').value;
  const marketing=field('publicidad').checked;

  const nickCheck=await supabaseClient.rpc('ahtv_nickname_disponible',{p_username:username});
  if(nickCheck.error){throw nickCheck.error;}
  if(nickCheck.data!==true){
    nicknameAvailable=false;
    usernameStatus.className='small username-status bad';
    usernameStatus.textContent='Ese nickname no está disponible. Elige otro.';
    registerBtn.disabled=false;
    updateRegisterButton();
    return;
  }

  const {data,error}=await supabaseClient.auth.signUp({
    email,
    password,
    options:{
      emailRedirectTo:ACCOUNT_URL,
      data:{
        full_name:fullName,
        username,
        document_type:documentType,
        document_number:documentNumber,
        phone,
        whatsapp,
        whatsapp_same:same,
        age_confirmed:true,
        terms_accepted:true,
        data_authorized:true,
        marketing_authorized:marketing,
        terms_version:'1.0',
        privacy_version:'1.0',
        data_authorization_version:'1.0'
      }
    }
  });

  if(error){
    const raw=String(error.message||'');
    const friendly=raw.toLowerCase().includes('nickname ya está en uso')||raw.toLowerCase().includes('nickname no está disponible')
      ? 'Ese nickname no está disponible. Elige otro.'
      : 'No fue posible crear la cuenta. '+raw;
    registerNotice.textContent=friendly;
    registerNotice.classList.add('show');
    registerBtn.disabled=false;
    return;
  }

  if(data.session){
    window.location.href='../index.html';
    return;
  }

  registerNotice.innerHTML='Cuenta creada correctamente.<br><br>Te enviamos un correo para confirmar tu dirección. Revisa también la carpeta de spam si no lo ves.<br><br><span id="redirectCountdown">Volviendo al inicio en 4 segundos…</span>';
  registerNotice.classList.add('show');
  registerBtn.disabled=true;
  let seconds=4;
  const redirectTimer=setInterval(()=>{
    seconds--;
    const countdown=document.getElementById('redirectCountdown');
    if(countdown)countdown.textContent='Volviendo al inicio en '+seconds+' segundo'+(seconds===1?'':'s')+'…';
    if(seconds<=0){
      clearInterval(redirectTimer);
      window.location.href='../index.html';
    }
  },1000);
  }catch(error){
    registerNotice.textContent='No fue posible completar el registro. '+(error?.message||'Verifica tu conexión e inténtalo nuevamente.');
    registerNotice.classList.add('show');
    registerBtn.disabled=false;
  }
});
updateRegisterButton();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
}
</script>
</body>
</html>
