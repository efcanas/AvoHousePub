name: Build Fondo WebP

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Convert background
        run: cwebp -quiet -q 82 Fondo.png -o Fondo.webp
      - name: Upload WebP artifact
        uses: actions/upload-artifact@v4
        with:
          name: fondo-webp
          path: Fondo.webp
          if-no-files-found: error
