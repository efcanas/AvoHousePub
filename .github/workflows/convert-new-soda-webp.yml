name: Convert new Sin Alcohol images to WebP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Convert soda images
        run: |
          cwebp -quiet -q 82 "productos/Soda Amarilla.png" -o "productos/Soda Amarilla.webp"
          cwebp -quiet -q 82 "productos/Soda Azul.png" -o "productos/Soda Azul.webp"
          cwebp -quiet -q 82 "productos/Soda Roja.png" -o "productos/Soda Roja.webp"
      - name: Commit WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "productos/Soda Amarilla.webp" "productos/Soda Azul.webp" "productos/Soda Roja.webp"
          git diff --cached --quiet && exit 0
          git commit -m "Convertir sodas de colores a WebP"
          git push
