name: Optimizar Fondo de AvoHouse a WebP

on:
  push:

permissions:
  contents: write

jobs:
  optimize:
    if: "!contains(github.event.head_commit.message, '[skip fondo webp]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar WebP
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convertir fondo
        run: cwebp -quiet -q 80 -m 6 Fondo.png -o Fondo.webp

      - name: Cambiar referencias al fondo
        run: |
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -not -path "./.git/*" -not -path "./.github/*" -print0 |
            xargs -0 sed -i 's/Fondo\.png/Fondo.webp/g'

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fondo.webp
          git add '*.html' '*.js' '*.css' || true
          git diff --cached --quiet && exit 0
          git commit -m "Optimizar fondo del sitio a WebP [skip fondo webp]"
          git push
