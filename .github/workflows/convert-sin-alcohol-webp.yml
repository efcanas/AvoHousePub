name: Convert Sin Alcohol images to WebP

on:
  push:
    branches: [main]
    paths:
      - "productos/Agua.png"
      - "productos/Coca-Cola.png"
      - "productos/Electrolit.png"
      - "productos/Ginder.png"
      - "productos/Soda.png"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Convert images
        run: |
          cwebp -quiet -q 82 productos/Agua.png -o productos/Agua.webp
          cwebp -quiet -q 82 productos/Coca-Cola.png -o productos/Coca-Cola.webp
          cwebp -quiet -q 82 productos/Electrolit.png -o productos/Electrolit.webp
          cwebp -quiet -q 82 productos/Ginder.png -o productos/Ginder.webp
          cwebp -quiet -q 82 productos/Soda.png -o productos/Soda.webp
      - name: Commit WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos/Agua.webp productos/Coca-Cola.webp productos/Electrolit.webp productos/Ginder.webp productos/Soda.webp
          git diff --cached --quiet && exit 0
          git commit -m "Convertir imágenes de Sin Alcohol a WebP"
          git push
